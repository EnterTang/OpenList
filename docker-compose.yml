services:
  openlist-etf:
    restart: always
    volumes:
      - '/Volumes/extend Disk/Github/OpenList/data:/opt/openlist/data'
    ports:
      - '5244:5244'
      - '5245:5245'
    user: '0:0'
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
    container_name: openlist-etf
    image: 'openlist:local'

  postgres-test:
    profiles: ['postgres-test']
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: openlist_test
      POSTGRES_USER: openlist_test
      POSTGRES_PASSWORD: openlist_test
    ports:
      - '55432:5432'
    tmpfs:
      - '/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openlist_test -d openlist_test']
      interval: 2s
      timeout: 2s
      retries: 15
